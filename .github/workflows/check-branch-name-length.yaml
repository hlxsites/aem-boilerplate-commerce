name: Branch Name Length Check
on:
  push:
    branches-ignore:
      - main

jobs:
  check-branch-name-length:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node .github/scripts/check-branch-name-length.mjs
