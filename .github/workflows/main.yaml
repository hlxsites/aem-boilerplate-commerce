name: Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 20
      uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: npm ci
    - run: npm run lint
    - run: npm test
  invoice-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: npm ci
    - name: Start invoice smoke server
      run: |
        python3 -m http.server 3000 --bind 127.0.0.1 > "$RUNNER_TEMP/invoice-smoke-server.log" 2>&1 &
        if ! curl --fail --silent --show-error --output /dev/null \
          --retry 30 --retry-connrefused --retry-delay 1 \
          --max-time 2 --retry-max-time 60 \
          http://127.0.0.1:3000/scripts/aem.js; then
          cat "$RUNNER_TEMP/invoice-smoke-server.log"
          exit 1
        fi
    - uses: cypress-io/github-action@v6
      with:
        working-directory: cypress
        command: npx cypress run --config-file cypress.saas.config.js --config baseUrl=http://127.0.0.1:3000 --spec src/tests/integration/invoices.spec.js
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: invoice-smoke-screenshots
        path: |
          cypress/screenshots
          ${{ runner.temp }}/invoice-smoke-server.log
