name: B2B E2E Tests (reusable)
on:
  workflow_call:
    inputs:
      config-file:
        required: true
        type: string
      grep-tags:
        required: true
        type: string
      url:
        required: true
        type: string
      is-aco:
        required: false
        type: boolean
        default: false
    secrets:
      AEM_ASSETS_PRIVATE_USER:
        required: false
      CYPRESS_IMS_CLIENT_ID:
        required: false
      CYPRESS_IMS_ORG_ID:
        required: false
      CYPRESS_IMS_CLIENT_SECRET:
        required: false
      CYPRESS_API_ENDPOINT:
        required: false
      CYPRESS_API_ENDPOINT_ACO:
        required: false
      CYPRESS_COMMERCE_ADMIN_USERNAME_ACO:
        required: false
      CYPRESS_COMMERCE_ADMIN_PASSWORD_ACO:
        required: false

jobs:
  b2b-e2e-groups:
    if: github.repository == 'hlxsites/aem-boilerplate-commerce'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # TEMPORARY: group-a/b/c disabled to isolate the new B2B Address Book
          # test in CI. Not meant to be merged this way — see local (untracked)
          # TODO_DISABLED_TESTS.md for the revert checklist.
          # - group: group-a
          #   specs:
          #     - src/tests/b2b/verifyCompanyCredit.spec.js
          #     - src/tests/b2b/verifyCompanyProfile.spec.js
          #     - src/tests/b2b/verifyCompanyRegistration.spec.js
          #     - src/tests/b2b/verifyCompanyRolesAndPermissions.spec.js
          #     - src/tests/b2b/verifyCompanyStructure.spec.js
          #     - src/tests/b2b/verifyCompanySwitcher.spec.js
          #     - src/tests/b2b/verifyCompanyUsers.spec.js
          #     - src/tests/b2b/verifyCompanyHierarchy.spec.js
          # - group: group-b
          #   specs:
          #     - src/tests/b2b/runB2CTests.spec.js
          #     - src/tests/b2b/verifyB2BGridOrdering.spec.js
          #     - src/tests/b2b/verifyB2BQuickOrder.spec.js
          #     - src/tests/b2b/verifyB2BQuoteToOrderPlacement.spec.js
          #     - src/tests/b2b/verifyB2BRequisitionLists.spec.js
          #     - src/tests/b2b/verifyB2BRequisitionListSharing.spec.js
          # - group: group-c
          #   specs:
          #     - src/tests/b2b/verifyPurchaseOrders.spec.js
          - group: group-address-book
            specs:
              - src/tests/b2b/verifyB2BAddressBook.spec.js
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            cypress/node_modules
            ~/.cache/Cypress
          key: deps-b2b-cypress-${{ hashFiles('package-lock.json', 'cypress/package-lock.json') }}
      - name: Install root dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci
      - name: Install adobe aem cli dependencies
        run: npm install -g @adobe/aem-cli
      - name: Start server in the background
        run: aem up --url ${{ inputs.url }} &
      - name: Install Cypress and run tests (${{ matrix.group }})
        uses: cypress-io/github-action@v6
        with:
          working-directory: cypress
          wait-on: 'http://localhost:3000'
          install: ${{ steps.cache-deps.outputs.cache-hit != 'true' }}
          command: npx cypress run --config-file ${{ inputs.config-file }} --env grepTags=${{ inputs.grep-tags }} --spec '${{ join(matrix.specs, ',') }}'
        env:
          AEM_ASSETS_PRIVATE_USER: ${{ secrets.AEM_ASSETS_PRIVATE_USER }}
          CYPRESS_API_ENDPOINT: ${{ inputs.is-aco && secrets.CYPRESS_API_ENDPOINT_ACO || secrets.CYPRESS_API_ENDPOINT }}
          CYPRESS_IMS_CLIENT_ID: ${{ secrets.CYPRESS_IMS_CLIENT_ID }}
          CYPRESS_IMS_ORG_ID: ${{ secrets.CYPRESS_IMS_ORG_ID }}
          CYPRESS_IMS_CLIENT_SECRET: ${{ secrets.CYPRESS_IMS_CLIENT_SECRET }}
          # Controls auth mode in accsClient.js: true = PaaS admin token, false = IMS
          CYPRESS_IS_ACO: ${{ inputs.is-aco }}
          CYPRESS_COMMERCE_ADMIN_USERNAME: ${{ inputs.is-aco && secrets.CYPRESS_COMMERCE_ADMIN_USERNAME_ACO || '' }}
          CYPRESS_COMMERCE_ADMIN_PASSWORD: ${{ inputs.is-aco && secrets.CYPRESS_COMMERCE_ADMIN_PASSWORD_ACO || '' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-${{ matrix.group }}
          path: cypress/screenshots
          if-no-files-found: ignore
