<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>HTML Example</title>
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <script
      async
      src="https://ga.jspm.io/npm:es-module-shims@1.7.2/dist/es-module-shims.js"
    ></script>
    <script type="importmap">
      {
        "imports": {
          "@dropins/tools/": "https://www.unpkg.com/@dropins/tools@0.42.0/",
          "@dropins/auth/": "../../"
        }
      }
    </script>
    <!-- Adobe Client Data Layer -->
    <script
      src="https://www.unpkg.com/@adobe-commerce/adobe-client-data-layer@2.0.2/dist/adobe-client-data-layer.min.js"
      async
      defer
    ></script>
    <style>
      /* Base Design System Tokens */
      /* .dropin-design { } */
    </style>
  </head>

  <body>
    <script type="module">
      import { htmlExampleConfig } from '../shared.js';

      import { initializers } from '@dropins/tools/initializer.js';
      import { Button } from '@dropins/tools/components.js';

      import { render as provider } from '@dropins/auth/render.js';
      import AuthCombine from '@dropins/auth/containers/AuthCombine.js';
      import SuccessNotification from '@dropins/auth/containers/SuccessNotification.js';

      import * as recaptcha from '@dropins/tools/recaptcha.js';

      import * as mesh from '@dropins/tools/fetch-graphql.js';
      import * as authApi from '@dropins/auth/api.js';

      const fr_FR = await fetch('../i18n/fr_FR.json').then((res) => res.json());
      const en_US = {
        Auth: {
          SuccessNotification: {
            createUser: {
              headingText: 'Welcome {userName}!',
              messageText: 'Your account has been successfully created.',
              primaryButtonText: 'My account',
              secondaryButtonText: 'Logout',
            },
            loginUser: {
              headingText: 'Welcome {userName}!',
              messageText: 'You successfully logged in.',
              primaryButtonText: 'Continue shopping',
              secondaryButtonText: 'Logout',
            },
          },
        },
      };

      mesh.setEndpoint(htmlExampleConfig.getMeshEndpoint());
      recaptcha.setConfig();

      initializers.register(authApi.initialize, {
        langDefinitions: { en_US, fr_FR },
      });
      initializers.mount();

      const helperSuccessNotification = (ctx, type) => {
        const userName = ctx?.isSuccessful?.userName || '';

        const elem = document.createElement('div');

        provider.render(SuccessNotification, {
          labels: {
            headingText:
              type === 'signUpForm'
                ? ctx.dictionary.Auth.SuccessNotification.createUser.headingText.replace(
                    '{userName}',
                    userName
                  )
                : ctx.dictionary.Auth.SuccessNotification.loginUser.headingText.replace(
                    '{userName}',
                    userName
                  ),
            messageText:
              type === 'signUpForm'
                ? ctx.dictionary.Auth.SuccessNotification.createUser.messageText
                : ctx.dictionary.Auth.SuccessNotification.loginUser.messageText,
          },
          slots: {
            SuccessNotificationActions: (ctx) => {
              const primaryBtn = document.createElement('div');

              provider.render(Button, {
                children:
                  ctx.dictionary.Auth.SuccessNotification.loginUser
                    .primaryButtonText,

                onClick: () => {
                  window.location.href = '/';
                },
              })(primaryBtn);

              ctx.appendChild(primaryBtn);

              const secondaryButton = document.createElement('div');
              secondaryButton.style.display = 'flex';
              secondaryButton.style.justifyContent = 'center';
              secondaryButton.style.marginTop = 'var(--spacing-xsmall)';

              provider.render(Button, {
                children:
                  ctx.dictionary.Auth.SuccessNotification.loginUser
                    .secondaryButtonText,
                variant: 'tertiary',
                onClick: async () => {
                  await authApi.revokeCustomerToken();
                  window.location.href = '/';
                },
              })(secondaryButton);

              ctx.appendChild(secondaryButton);
            },
          },
        })(elem);

        ctx.appendChild(elem);
      };

      const signInForm = {
        renderSignUpLink: true,
        routeSignUp: () => 'registration.html',
        routeForgotPassword: () => 'reset-password.html',
        slots: {
          SuccessNotification: (ctx) => {
            helperSuccessNotification(ctx, 'signInForm');
          },
        },
      };

      const signUpForm = {
        inputsDefaultValueSet: [
          { code: 'firstname', defaultValue: 'Prefilled value from props' },
        ],
        apiVersion2: false,
        routeSignIn: () => 'login.html',
        slots: {
          SuccessNotification: (ctx) => {
            helperSuccessNotification(ctx, 'signUpForm');
          },
        },
      };

      const resetPasswordForm = {
        onErrorCallback: (error) => {
          console.log('error :>> ', error);
        },
      };

      await provider.render(AuthCombine, {
        defaultView: 'signUpForm',
        signInFormConfig: signInForm,
        signUpFormConfig: signUpForm,
        resetPasswordFormConfig: resetPasswordForm,
      })(document.getElementById('AuthCombine'));
    </script>

    <div id="app">
      <div
        class="containers"
        style="max-width: 1200px; width: 100%; box-sizing: border-box"
      >
        <h2 class="heading">Frontend Containers</h2>
        <h3>AuthCombine Container</h3>
        <div id="AuthCombine" class="container"></div>
      </div>
    </div>

    <link rel="stylesheet" href="../styles.css" />
  </body>
</html>
