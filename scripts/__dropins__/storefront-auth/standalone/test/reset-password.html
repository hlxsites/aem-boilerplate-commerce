<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>HTML Example</title>
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <script
      async
      src="https://ga.jspm.io/npm:es-module-shims@1.7.2/dist/es-module-shims.js"
    ></script>
    <script type="importmap">
      {
        "imports": {
          "@dropins/tools/": "https://www.unpkg.com/@dropins/tools@0.42.0/",
          "@dropins/auth/": "../../"
        }
      }
    </script>
    <!-- Adobe Client Data Layer -->
    <script
      src="https://www.unpkg.com/@adobe-commerce/adobe-client-data-layer@2.0.2/dist/adobe-client-data-layer.min.js"
      async
      defer
    ></script>
    <style>
      /* Base Design System Tokens */
      /* .dropin-design { } */
    </style>
  </head>

  <body>
    <script type="module">
      import { htmlExampleConfig } from '../shared.js';

      import { initializers } from '@dropins/tools/initializer.js';

      import { render as provider } from '@dropins/auth/render.js';
      import ResetPassword from '@dropins/auth/containers/ResetPassword.js';

      import * as recaptcha from '@dropins/tools/recaptcha.js';

      import * as mesh from '@dropins/tools/fetch-graphql.js';
      import * as authApi from '@dropins/auth/api.js';

      const fr_FR = await fetch('../i18n/fr_FR.json').then((res) => res.json());

      mesh.setEndpoint(htmlExampleConfig.getMeshEndpoint());
      recaptcha.setConfig();

      initializers.register(authApi.initialize, {
        langDefinitions: { fr_FR },
      });
      initializers.mount();

      await provider.render(ResetPassword, {
        routeSignIn: () => 'login.html',
        onErrorCallback: (error) => {
          console.log('error :>> ', error);
        },
      })(document.getElementById('ResetPassword'));
    </script>

    <div id="app">
      <div
        class="containers"
        style="max-width: 1200px; width: 100%; box-sizing: border-box"
      >
        <h3>ResetPassword Container</h3>
        <div id="ResetPassword" class="container"></div>
      </div>
    </div>

    <link rel="stylesheet" href="../styles.css" />
  </body>
</html>
